name: Jekyll build and research SEO check

on:
  pull_request:
    paths:
      - 'index.html'
      - '_pages/**'
      - '_publications/**'
      - '_layouts/**'
      - '_includes/**'
      - '_config.yml'
      - 'scripts/audit_site.py'
      - 'scripts/indexnow.py'
      - 'scripts/test_indexnow.py'
      - '.github/workflows/indexnow.yml'
      - 'research.json'
      - 'publications.json'
      - 'robots.txt'
      - 'sitemap-diagnostic.txt'
      - '.github/workflows/site-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check built pages, citations, and bilingual research data
        run: python3 scripts/audit_site.py _site
      - name: Test IndexNow submission validation offline
        run: python3 -m unittest discover -s scripts -p 'test_indexnow.py' -v
      - name: Diagnose LIVE sitemap responses from a GitHub-hosted external runner
        continue-on-error: true
        run: |
          set -e
          for agent in standard simulated-googlebot; do
            echo "--- LIVE sitemap.xml request: $agent ---"
            if [ "$agent" = "simulated-googlebot" ]; then
              curl -sS -L -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' --max-time 25 -D /tmp/sitemap-headers.txt -o /tmp/sitemap-body.xml -w 'HTTP=%{http_code} bytes=%{size_download} content_type=%{content_type} redirects=%{num_redirects}\n' https://floatingcatty.github.io/sitemap.xml
            else
              curl -sS -L --max-time 25 -D /tmp/sitemap-headers.txt -o /tmp/sitemap-body.xml -w 'HTTP=%{http_code} bytes=%{size_download} content_type=%{content_type} redirects=%{num_redirects}\n' https://floatingcatty.github.io/sitemap.xml
            fi
            grep -Ei '^(HTTP/|content-type:|content-encoding:|location:|server:|cache-control:|x-github-request-id:)' /tmp/sitemap-headers.txt || true
            python3 -c "from xml.etree import ElementTree as ET; root=ET.parse('/tmp/sitemap-body.xml').getroot(); print('XML root:',root.tag,'; URLs:',sum(x.tag.endswith('}loc') for x in root.iter()))"
          done

